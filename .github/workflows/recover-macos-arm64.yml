name: Recover macOS ARM64 Preview

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Preview run containing the Windows x64 and Linux x64 builds
        required: false
        type: string
  push:
    branches:
      - 'build/macos-arm64'
      - 'build/macos-arm64-intel'

permissions:
  contents: read
  actions: read

concurrency:
  group: recover-macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run-id: ${{ steps.source.outputs.run-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify reusable platform packages and their source revision
        id: source
        uses: actions/github-script@v9
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          script: |
            const { execFileSync, spawnSync } = require('node:child_process');
            const { data: workflow } = await github.rest.actions.getWorkflow({
              ...context.repo, workflow_id: 'package-preview.yml'
            });
            const requested = process.env.SOURCE_RUN_ID.trim();
            let runs;
            if (requested) {
              if (!/^\d+$/.test(requested)) throw new Error('Invalid source run ID');
              const { data } = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: Number(requested)
              });
              runs = [data];
            } else {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: workflow.id, status: 'completed', per_page: 100
              });
              runs = data.workflow_runs;
            }
            const platforms = ['windows-x64', 'linux-x64'];
            for (const run of runs) {
              if (run.workflow_id !== workflow.id || run.status !== 'completed') continue;
              const ancestor = spawnSync('git', ['merge-base', '--is-ancestor', run.head_sha, context.sha]);
              if (ancestor.status !== 0) continue;
              const changes = execFileSync('git', [
                'diff', '--name-only', run.head_sha, context.sha, '--',
                'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml',
                'packages/desktop', 'packages/muya', 'scripts'
              ], { encoding: 'utf8' }).trim();
              if (changes) continue;
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                ...context.repo, run_id: run.id, filter: 'all', per_page: 100
              });
              const verified = jobs.jobs.some(job => job.name === 'verify' && job.conclusion === 'success');
              const built = platforms.every(platform =>
                jobs.jobs.some(job => job.name === 'Package (' + platform + ')' && job.conclusion === 'success')
              );
              if (!verified || !built) continue;
              const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: run.id, per_page: 100
              });
              const complete = platforms.every(platform =>
                artifacts.artifacts.some(artifact => artifact.name === 'autumnmark-' + platform + '-preview' && !artifact.expired)
              );
              if (!complete) continue;
              core.setOutput('run-id', String(run.id));
              core.info('Reusing verified companion builds from ' + run.html_url);
              await core.summary.addHeading('Verified companion builds').addLink('Source build', run.html_url).write();
              return;
            }
            throw new Error('No matching run contains all required companion builds and passing verification');

  restore:
    name: Reuse (${{ matrix.platform }})
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, linux-x64]
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: autumnmark-${{ matrix.platform }}-preview
          path: dist
          run-id: ${{ needs.select.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify companion package checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS-${{ matrix.platform }}.txt

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: autumnmark-${{ matrix.platform }}-preview
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  arm64:
    name: Package (macos-arm64)
    needs: select
    runs-on: ${{ github.ref_name == 'build/macos-arm64-intel' && 'macos-15-intel' || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'

      - name: Install optional binaries for both host and target architectures
        if: runner.arch == 'X64'
        run: |
          python -m pip install PyYAML==6.0.3
          python <<'PY'
          from pathlib import Path
          import yaml
          path = Path('pnpm-workspace.yaml')
          config = yaml.safe_load(path.read_text())
          config['supportedArchitectures'] = {'os': ['current'], 'cpu': ['x64', 'arm64']}
          path.write_text(yaml.safe_dump(config, sort_keys=False))
          PY
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Set C++20 for macOS native modules
        run: echo "CXXFLAGS=-std=gnu++20 -stdlib=libc++" >> "$GITHUB_ENV"

      - name: Prepare Electron and native modules
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'

      - name: Build Apple Silicon packages
        if: runner.arch == 'ARM64'
        run: pnpm build:mac:arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cross-compile Apple Silicon native modules and packages
        if: runner.arch == 'X64'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: arm64
        run: |
          pnpm -C packages/desktop exec electron-rebuild -f --arch=arm64
          pnpm -C packages/desktop exec electron-vite build
          pnpm -C packages/desktop exec electron-builder --mac --arm64 --publish never

      - name: Verify Apple Silicon binary architectures
        run: |
          node <<'NODE'
          const { existsSync } = require('node:fs')
          const { join } = require('node:path')
          const { execFileSync } = require('node:child_process')
          const contents = 'dist/mac-arm64/AutumnMark+.app/Contents'
          const verify = path => {
            execFileSync('lipo', [path, '-verify_arch', 'arm64'], { stdio: 'inherit' })
            console.log('Verified ARM64: ' + path)
          }
          verify(join(contents, 'MacOS/AutumnMark+'))
          const modules = join(contents, 'Resources/app.asar.unpacked/node_modules')
          for (const path of [
            'ced/build/Release/ced.node',
            'keytar/build/Release/keytar.node',
            'native-keymap/build/Release/keymapping.node'
          ]) verify(join(modules, path))
          const ripgrep = join(modules, '@vscode/ripgrep-darwin-arm64/bin/rg')
          const hasRipgrep = existsSync(ripgrep)
          if (!hasRipgrep) throw new Error('The ARM64 search binary is missing')
          verify(ripgrep)
          NODE

      - name: Create package checksums
        run: |
          node <<'NODE'
          const { readdirSync, readFileSync, writeFileSync } = require('node:fs')
          const { createHash } = require('node:crypto')
          const names = readdirSync('dist').filter(name => /\.(dmg|zip)$/.test(name)).sort()
          if (names.length !== 2) throw new Error('Expected DMG and ZIP packages')
          const lines = names.map(name => createHash('sha256').update(readFileSync('dist/' + name)).digest('hex') + '  ' + name)
          writeFileSync('dist/SHA256SUMS-macos-arm64.txt', lines.join('\n') + '\n')
          NODE

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: autumnmark-macos-arm64-preview
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-macos-arm64.txt
