# NSIS derives the Windows uninstall key from appId. Keep it in sync with APP_ID in src/shared/brand.ts.
appId: io.github.autumn-one.autumnmark
productName: AutumnMark+
# The packaged name determines the updater cache and configuration directory.
extraMetadata:
  name: autumnmark
publish:
  provider: github
  owner: small32
  repo: Autumnmark
  # Older releases used MarkText's install identity. Match scripts/merge-release-artifacts.py.
  channel: autumnmark
directories:
  buildResources: build
  output: ../../dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!node_modules/dragula/resources'
  - '!node_modules/**/*.js.map'
  - '!node_modules/**/*.cjs.map'
  - '!node_modules/**/*.mjs.map'
  - '!node_modules/**/*.ts.map'
  - '!node_modules/@vscode/ripgrep/{jsconfig.json,*.md,LICENSE}'
  - '!node_modules/@vscode/ripgrep/lib/download.js'
  - '!node_modules/@vscode/ripgrep/lib/postinstall.js'
  - '!node_modules/ced/vendor'
  - '!node_modules/mermaid/dist/mermaid.js'
  - '!node_modules/mermaid/dist/mermaid.min.js'
  - '!node_modules/mermaid/dist/mermaid.esm.min.mjs'
  - '!node_modules/katex/dist/katex.min.js'
  - '!node_modules/katex/dist/katex.mjs'
  - '!node_modules/ced/build/Release/compact_enc_det.a'
  - '!node_modules/**/{*.vcxproj,*.vcxproj.filters}'
  - '!node_modules/**/build/Release/{*.lib,*.exp,*.ilk,*.pdb,*.iobj,*.ipdb}'
  - '!node_modules/**/build/Release/obj'
  - '!eslint.config.js'
  - '!jsconfig.json'
  - '!docs/*'
extraResources:
  - from: build/icons
    to: icons
    filter:
      - '*.ico'
  # In-place updater scripts ship with every build so an update is always
  # applied by the script that belongs to the version being installed.
  - from: build/update
    to: update
    filter:
      - '**/*'
  - from: static
    to: static
    filter:
      - '**/*'
      - '!locales/**/!(*.min).json'
npmRebuild: false
electronLanguages: # Keep Chromium/AppKit locales for the UI languages MarkText supports
  # Values must cover both spellings: "xx-YY" .pak files on Windows and
  # "xx_YY" .lproj bundles on macOS. Keeping them lets OS-provided strings
  # (e.g. the macOS Window management items) localize on non-English systems;
  # the in-built locales are still the source for the app's own UI.
  - en-US
  - en
  - de
  - es
  - fr
  - it
  - ja
  - ko
  - nl
  - pt-BR
  - pt-PT
  - pt_BR
  - pt_PT
  - ru
  - tr
  - zh-CN
  - zh-TW
  - zh_CN
  - zh_TW

electronFuses:
  # Node's CLI parser inside Electron rejects `--debug` (DEP0062, exit 9) before
  # MarkText can read it (#5409). With this fuse off the packaged app ignores
  # Node's inspector flags, so `--debug` reaches MarkText.
  enableNodeCliInspectArguments: false
  # Flipping a fuse rewrites the Electron Framework binary, invalidating the
  # ad-hoc signature its linker wrote. Unsigned macOS arm64 builds are then
  # killed on launch (Code Signature Invalid), so re-sign ad-hoc after flipping.
  resetAdHocDarwinSignature: true

asarUnpack:
  - resources/**
win:
  # NSIS uses the executable name for its default directory. Older releases used autumnmark.
  # The release builds ship AutumnMark+.exe; the updater script falls back to
  # any executable in the folder so 0.1.5 installs can still restart.
  executableName: 'AutumnMark+'
  artifactName: 'autumnmark-win-${arch}-${version}.${ext}'
  target:
    - target: 'nsis'
      arch: [x64]
    - target: 'zip'
      arch: [x64]
  icon: static/icon.ico
nsis:
  artifactName: 'autumnmark-win-${arch}-${version}-setup.${ext}'
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: true
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  include: windows/installer.nsh
mac:
  fileAssociations:
    - ext: [md, markdown, mmd, mdown, mdtxt, mdtext]
      name: Markdown
      description: Markdown document
      mimeType: text/markdown
      role: Editor
      icon: icons/md.ico
  artifactName: 'autumnmark-mac-${arch}-${version}.${ext}'
  entitlementsInherit: build/mac/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  icon: static/icon.icns
  notarize: false
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
dmg:
  artifactName: 'autumnmark-mac-${arch}-${version}.${ext}'
  filesystem: APFS
  contents:
    - x: 410
      y: 240
      type: 'link'
      path: '/Applications'
    - x: 130
      y: 240
      type: 'file'
