name: Release AutumnMark+

on:
  push:
    # Broad trigger so the validate job can reject malformed v-tags
    # (e.g. `vbad.tag`) instead of them silently not triggering anything.
    tags:
      - 'v*'
      # Preview releases reuse verified build artifacts instead of rebuilding every platform.
      - '!v*-preview.*'
      # Any other prerelease suffix (e.g. `-rc.1`, `-beta.2`) belongs to the
      # preview workflow as well; letting it through here would publish the
      # same tag twice (full build + asset attachment).
      - '!v*-rc.*'
      - '!v*-beta.*'
      - '!v*-alpha.*'
      - '!v*-pre.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate semver tag
        run: |
          tag="${GITHUB_REF_NAME}"
          # SemVer 2.0.0 with leading "v"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a valid semver (expected vX.Y.Z[-prerelease][+build])"
            exit 1
          fi
          echo "Tag '$tag' is valid."

      - name: Reject prerelease tags
        run: |
          tag="${GITHUB_REF_NAME}"
          # Prerelease versions are published by attach-preview-packages.yml
          # (draft release + verified build artifacts). Publishing them here
          # would build and publish the same tag twice.
          if [[ "$tag" == *-* ]]; then
            echo "::error::Tag '$tag' is a prerelease version. Use the preview flow (release/* branch + attach-preview-packages workflow)."
            exit 1
          fi

      - name: Match tag to application version
        run: |
          node <<'NODE'
          const expected = process.env.GITHUB_REF_NAME.slice(1)
          for (const filename of ['./package.json', './packages/desktop/package.json']) {
            const { version } = require(filename)
            if (version !== expected) throw new Error(`${filename}: ${version} does not match ${expected}`)
          }
          NODE

  verify:
    name: Verify release code
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'

      - name: Verify desktop code and unit tests
        run: pnpm check && pnpm test:unit

      - name: Test Muya content tabs and document switching
        run: pnpm -C packages/muya test src/__tests__/contentTabs.spec.ts src/__tests__/setContent.spec.ts src/state/__tests__/contentTabs.spec.ts src/utils/__tests__/contentTabs.spec.ts

  build:
    name: Build (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
          - name: windows-x64
            os: windows-latest
            platform: windows
            arch: x64
          - name: macos-arm64
            os: macos-15-intel
            platform: macos
            arch: arm64

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Enable Git long paths on Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/llvm.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm18.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-18 libstdc++-12-dev icnsutils graphicsmagick xz-utils libx11-dev libxkbfile-dev gnome-keyring libsecret-1-dev libfontconfig-dev rpm

      - name: Use Clang for Electron 45 headers
        if: matrix.platform == 'linux'
        run: |
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-std=c++20" >> "$GITHUB_ENV"
          clang++-18 --version
          printf '#include <source_location>\nint main() { return std::source_location::current().line() == 0; }\n' | clang++-18 -std=c++20 -x c++ - -fsyntax-only

      - name: Install Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Setup pnpm + Node + dependencies
        uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'
          desktop-only: 'true'

      # Cache Electron binary; key on package.json so it busts when Electron version changes.
      - name: Cache Electron binary
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ matrix.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            electron-${{ matrix.os }}-

      - name: Install optional binaries for both host and target architectures
        if: matrix.name == 'macos-arm64'
        run: |
          python -m pip install PyYAML==6.0.3
          python <<'PY'
          from pathlib import Path
          import yaml
          path = Path('pnpm-workspace.yaml')
          config = yaml.safe_load(path.read_text())
          config['supportedArchitectures'] = {'os': ['current'], 'cpu': ['x64', 'arm64']}
          path.write_text(yaml.safe_dump(config, sort_keys=False))
          PY
          pnpm install --frozen-lockfile --ignore-scripts

      # Electron's V8 headers require C++20 for native modules on macOS.
      - name: Set C++20 for MacOS
        if: matrix.platform == 'macos'
        run: |
          echo "CXXFLAGS=-std=gnu++20 -stdlib=libc++" >> $GITHUB_ENV

      # Run the full postinstall: Electron binary download, patch-package,
      # electron-rebuild, and minify-locales.
      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'
          USE_ELECTRON_CLANG: ${{ matrix.platform == 'linux' && '0' || '' }}

      - name: build-linux
        if: matrix.platform == 'linux'
        run: pnpm run build:linux:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cross-compile Apple Silicon native modules and packages
        if: matrix.name == 'macos-arm64'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: arm64
        run: |
          pnpm -C packages/desktop exec electron-rebuild -f --arch=arm64
          pnpm -C packages/desktop exec electron-vite build
          build_log=$(mktemp "$RUNNER_TEMP/autumnmark-dmg.XXXXXX")
          if pnpm -C packages/desktop exec electron-builder --mac --arm64 --publish never 2>&1 | tee "$build_log"; then
            exit 0
          fi
          if ! grep -Eq 'hdiutil:.*Resource busy' "$build_log"; then
            exit 1
          fi
          echo "::warning::Retrying macOS packaging after hdiutil reported a busy disk image"
          pnpm -C packages/desktop exec electron-builder --mac --arm64 --publish never

      - name: Verify Apple Silicon binary architectures
        if: matrix.name == 'macos-arm64'
        run: |
          node <<'NODE'
          const { existsSync } = require('node:fs')
          const { join } = require('node:path')
          const { execFileSync } = require('node:child_process')
          const contents = 'dist/mac-arm64/AutumnMark+.app/Contents'
          const verify = path => {
            execFileSync('lipo', [path, '-verify_arch', 'arm64'], { stdio: 'inherit' })
            console.log('Verified ARM64: ' + path)
          }
          verify(join(contents, 'MacOS/AutumnMark+'))
          const modules = join(contents, 'Resources/app.asar.unpacked/node_modules')
          for (const path of [
            'ced/build/Release/ced.node',
            'keytar/build/Release/keytar.node',
            'native-keymap/build/Release/keymapping.node'
          ]) verify(join(modules, path))
          const ripgrep = join(modules, '@vscode/ripgrep-darwin-arm64/bin/rg')
          const hasRipgrep = existsSync(ripgrep)
          if (!hasRipgrep) throw new Error('The ARM64 search binary is missing')
          verify(ripgrep)
          NODE

      - name: build-win
        if: matrix.platform == 'windows'
        run: pnpm run build:win:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify table resizing in the Windows release archive
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $target = Join-Path $env:RUNNER_TEMP 'autumnmark-release-check'
          Expand-Archive -LiteralPath "dist/autumnmark-win-x64-$version.zip" -DestinationPath $target
          $env:AUTUMNMARK_PACKAGED_EXE = (Get-Item "$target/AutumnMark+.exe").FullName
          pnpm -C packages/desktop exec playwright test packaged-table-layout.spec.ts --reporter=github

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: autumnmark-${{ matrix.name }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.blockmap
            dist/*.yml
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  release:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    # Per-job permissions REPLACE workflow-level ones, so re-declare
    # both: contents:write to publish the release, actions:read for
    # download-artifact's Actions API calls.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: Install Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Verify and collect release assets
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/merge-release-artifacts.py artifacts dist "${GITHUB_REF_NAME#v}"

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          # Deterministic ordering so identical inputs always produce identical output
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -I{} sha256sum "{}" > SHA256SUMS.txt
          echo "---"
          cat SHA256SUMS.txt

      - name: Compose release notes body
        env:
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          # RC tags (e.g. v0.1.2-rc.1) use the stable version as the CHANGELOG
          # heading (## AutumnMark+ 0.1.2), so strip any -/+ prerelease suffix.
          release_version="${GITHUB_REF_NAME#v}"
          stable_version="${release_version%%[-+]*}"
          highlights=$(awk -v version="${stable_version}" '
            # Accept both the current product heading and the legacy one so a
            # hotfix on an older version still finds its notes.
            $0 == "## AutumnMark+ " version || $0 == "## AutumnMark " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' packages/website/content/docs/CHANGELOG.md)
          {
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              echo "## ❗ This is a pre-release"
              echo "- May contain bugs and unfinished features."
              echo ""
            fi
            if [[ -n "$highlights" ]]; then
              printf '## What’s new\n%s\n\n' "$highlights"
            fi
            echo "## First installation"
            echo "Download the installer for your platform below. AutumnMark+ keeps using the existing AutumnMark profile directory, so settings and recent files from an earlier installation are preserved."
            echo ""
            echo "首次安装请下载对应平台的安装包。AutumnMark+ 继续使用原有 AutumnMark 设置目录，已有配置和最近文件会保留。"
            echo ""
            echo "## ⚠️ Note for macOS users"
            echo "Builds are unsigned (no Apple Developer ID). After dragging AutumnMark+ into Applications, clear the quarantine flag once:"
            echo '```'
            echo 'xattr -d com.apple.quarantine /Applications/AutumnMark+.app'
            echo '```'
            echo ""
            echo "## Verifying downloads"
            echo "All artifacts are listed with their SHA-256 in \`SHA256SUMS.txt\`. Verify with:"
            echo '```'
            echo 'sha256sum -c SHA256SUMS.txt --ignore-missing'
            echo '```'
          } > release_body.md

      - name: Select previous stable release
        id: release-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          previous_tag=$(python scripts/select-release-base.py "${GITHUB_REF_NAME}" --allow-first-release < releases.json)
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"
          echo "Release notes range: ${previous_tag}...${GITHUB_REF_NAME}"

      # Immutable-release repos forbid adding assets to an already-published
      # release, and action-gh-release publishes before uploading the assets.
      # Create the release as a draft (assets allowed), then promote it to a
      # published release in the next step.
      - name: Create draft release with assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          previous_tag: ${{ steps.release-base.outputs.previous_tag }}
          name: ${{ github.ref_name }}
          body_path: release_body.md
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote draft to published release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
