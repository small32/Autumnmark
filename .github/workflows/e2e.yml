name: E2E Test

on:
  push:
    branches: [hotfix/v0.24.45]
  workflow_dispatch:
    inputs:
      platform:
        description: Hosted OS for the desktop test
        type: choice
        options: [windows]
        default: windows
      grep:
        description: Playwright test title pattern (empty runs the full desktop suite)
        type: string
        required: false
  pull_request:
    types: [opened, synchronize, reopened]
    # This is the desktop electron Playwright suite. packages/muya has its
    # own e2e under packages/muya/e2e/ wired via muya-e2e.yml.
    paths-ignore:
      - 'packages/muya/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: ./.github/actions/setup
        with:
          desktop-only: 'true'

      # Run the full postinstall: Electron binary download, patch-package,
      # electron-rebuild, and minify-locales.
      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'

      - name: Build app
        run: pnpm build

      - name: Check release code before tagging
        if: github.event_name == 'push'
        run: pnpm check

      - name: Run E2E Tests
        shell: bash
        env:
          TEST_GREP: ${{ inputs.grep }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            pnpm -C packages/desktop exec playwright test test/e2e/preferences-window.spec.ts test/e2e/theme-studio.spec.ts test/e2e/theme-library.spec.ts test/e2e/theme-collaboration.spec.ts --grep='Theme settings page|theme preview compares|online themes install|deleting an active custom theme|Theme menu opens|CSS inspector docks|a file-based agent|one theme studio|theme library deletes|previously saved themes|saving an active theme|AI and CSS edit'
            exit $?
          fi
          pnpm test:e2e --grep="${TEST_GREP:-.*}"
