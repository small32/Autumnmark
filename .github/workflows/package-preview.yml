name: Package Antumnmark+ Preview

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/*'
      - '!build/macos-arm64'
      - '!build/macos-arm64-intel'

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'

      - name: Check code and types
        run: pnpm check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Test Muya content tabs and document switching
        run: pnpm -C packages/muya test src/__tests__/contentTabs.spec.ts src/__tests__/setContent.spec.ts src/state/__tests__/contentTabs.spec.ts src/utils/__tests__/contentTabs.spec.ts

  package:
    name: Package (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            platform: linux
            command: build:linux:x64
          - name: windows-x64
            os: windows-latest
            platform: windows
            command: build:win:x64
          - name: macos-arm64
            os: macos-15-intel
            platform: macos
            command: build:mac:arm64
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Enable long paths
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/llvm.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm18.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-18 libstdc++-12-dev icnsutils graphicsmagick xz-utils libx11-dev libxkbfile-dev gnome-keyring libsecret-1-dev libfontconfig-dev rpm

      - name: Use Clang for Electron 45 headers
        if: matrix.platform == 'linux'
        run: |
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-std=c++20" >> "$GITHUB_ENV"
          clang++-18 --version
          printf '#include <source_location>\nint main() { return std::source_location::current().line() == 0; }\n' | clang++-18 -std=c++20 -x c++ - -fsyntax-only

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'
          desktop-only: 'true'

      - name: Install optional binaries for both host and target architectures
        if: matrix.name == 'macos-arm64'
        run: |
          python -m pip install PyYAML==6.0.3
          python <<'PY'
          from pathlib import Path
          import yaml
          path = Path('pnpm-workspace.yaml')
          config = yaml.safe_load(path.read_text())
          config['supportedArchitectures'] = {'os': ['current'], 'cpu': ['x64', 'arm64']}
          path.write_text(yaml.safe_dump(config, sort_keys=False))
          PY
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Set C++20 for macOS native modules
        if: matrix.platform == 'macos'
        run: echo "CXXFLAGS=-std=gnu++20 -stdlib=libc++" >> "$GITHUB_ENV"

      - name: Prepare Electron and native modules
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'
          USE_ELECTRON_CLANG: ${{ matrix.platform == 'linux' && '0' || '' }}

      - name: Build platform packages
        if: matrix.name != 'macos-arm64'
        run: pnpm run ${{ matrix.command }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cross-compile Apple Silicon native modules and packages
        if: matrix.name == 'macos-arm64'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: arm64
        run: |
          pnpm -C packages/desktop exec electron-rebuild -f --arch=arm64
          pnpm -C packages/desktop exec electron-vite build
          pnpm -C packages/desktop exec electron-builder --mac --arm64 --publish never

      - name: Verify Apple Silicon binary architectures
        if: matrix.name == 'macos-arm64'
        run: |
          node <<'NODE'
          const { existsSync } = require('node:fs')
          const { join } = require('node:path')
          const { execFileSync } = require('node:child_process')
          const contents = 'dist/mac-arm64/Antumnmark+.app/Contents'
          const verify = path => {
            execFileSync('lipo', [path, '-verify_arch', 'arm64'], { stdio: 'inherit' })
            console.log('Verified ARM64: ' + path)
          }
          verify(join(contents, 'MacOS/Antumnmark+'))
          const modules = join(contents, 'Resources/app.asar.unpacked/node_modules')
          for (const path of [
            'ced/build/Release/ced.node',
            'keytar/build/Release/keytar.node',
            'native-keymap/build/Release/keymapping.node'
          ]) verify(join(modules, path))
          const ripgrep = join(modules, '@vscode/ripgrep-darwin-arm64/bin/rg')
          const hasRipgrep = existsSync(ripgrep)
          if (!hasRipgrep) throw new Error('The ARM64 search binary is missing')
          verify(ripgrep)
          NODE

      - name: Create platform checksums
        shell: bash
        env:
          PLATFORM: ${{ matrix.name }}
        run: |
          node <<'NODE'
          const { readdirSync, readFileSync, writeFileSync } = require('node:fs')
          const { createHash } = require('node:crypto')
          const names = readdirSync('dist').filter(name => /\.(exe|zip|dmg|AppImage|snap|deb|rpm|tar\.gz)$/.test(name)).sort()
          if (!names.length) throw new Error('No platform packages were produced')
          const lines = names.map(name => createHash('sha256').update(readFileSync('dist/' + name)).digest('hex') + '  ' + name)
          writeFileSync('dist/SHA256SUMS-' + process.env.PLATFORM + '.txt', lines.join('\n') + '\n')
          NODE

      - name: Upload platform packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: autumnmark-${{ matrix.name }}-preview
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS-${{ matrix.name }}.txt
